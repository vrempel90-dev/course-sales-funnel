name: checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for repair
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo LOCKFILE_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_END
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:http
